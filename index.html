<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUIZ DVA 1</title>
<style>
:root {
  --azul:#0b1f3a; --azul2:#173d6b; --vermelho:#d62828; --verde:#16803c;
  --cinza:#eef2f7; --texto:#172033; --branco:#fff; --amarelo:#fff4cc;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,var(--azul),var(--azul2));color:var(--texto);min-height:100vh}
.app{max-width:850px;margin:auto;min-height:100vh;background:#f8fafc;box-shadow:0 0 30px rgba(0,0,0,.28)}
header{background:var(--azul);color:white;padding:20px;text-align:center;border-bottom:6px solid var(--vermelho)}
header h1{margin:0;font-size:clamp(25px,5vw,40px)} header p{margin:8px 0 0;font-size:18px}
.progress-wrap{background:#dfe7f0;height:12px} .progress{height:100%;width:0;background:var(--vermelho);transition:.3s}
main{padding:18px}
.card{background:white;border-radius:20px;padding:22px;box-shadow:0 7px 22px rgba(12,35,64,.13);margin-bottom:16px}
.badge{display:inline-block;background:var(--vermelho);color:white;padding:8px 13px;border-radius:999px;font-weight:bold}
.question{font-size:clamp(22px,4.5vw,32px);font-weight:800;line-height:1.3;margin:18px 0}
.option{display:block;width:100%;text-align:left;margin:12px 0;padding:16px 18px;border:2px solid #cad5e2;background:#fff;border-radius:14px;font-size:20px;font-weight:700;cursor:pointer}
.option:hover{border-color:var(--azul2);transform:translateY(-1px)}
.option.correct{background:#dff6e7;border-color:var(--verde);color:#0b5d2a}
.option.wrong{background:#fde2e2;border-color:var(--vermelho);color:#8f1515}
.explanation{display:none;margin-top:18px;padding:18px;background:var(--amarelo);border-left:6px solid #e5a800;border-radius:12px;font-size:19px;line-height:1.5}
.nav{display:flex;gap:12px;margin-top:18px} .nav button,.start button,.result button{flex:1;border:0;border-radius:14px;padding:16px;font-size:19px;font-weight:bold;cursor:pointer}
.primary{background:var(--vermelho);color:white} .secondary{background:var(--azul);color:white}
.start,.result{text-align:center;padding:30px 18px} .start h2,.result h2{font-size:34px;color:var(--azul)} .start p,.result p{font-size:20px;line-height:1.5}
.hidden{display:none} .score{font-size:64px;font-weight:900;color:var(--vermelho);margin:15px 0}
footer{padding:18px;text-align:center;background:var(--azul);color:white;font-weight:bold}
@media(max-width:560px){main{padding:12px} .card{padding:17px} .option{font-size:18px} .nav{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<header><h1>QUIZ DVA 1</h1><p>Curso de Contabilidade Professor Moreira</p></header>
<div class="progress-wrap"><div id="progress" class="progress"></div></div>
<main>
<section id="start" class="start card">
<h2>Demonstração do Valor Adicionado</h2>
<p>Responda às 10 questões. Após marcar uma alternativa, veja imediatamente o gabarito comentado.</p>
<button class="primary" onclick="startQuiz()">INICIAR QUIZ</button>
</section>
<section id="quiz" class="hidden">
<div class="card">
<span id="badge" class="badge"></span>
<div id="question" class="question"></div>
<div id="options"></div>
<div id="explanation" class="explanation"></div>
<div class="nav">
<button class="secondary" onclick="prevQuestion()">← VOLTAR</button>
<button class="primary" onclick="nextQuestion()">PRÓXIMA →</button>
</div>
</div>
</section>
<section id="result" class="result card hidden">
<h2>Resultado Final</h2>
<div id="score" class="score"></div>
<p id="message"></p>
<button class="primary" onclick="restartQuiz()">REINICIAR QUIZ</button>
</section>
</main>
<footer>Professor Moreira • DVA • CPC 09</footer>
</div>
<script>
const questions = [{"q": "De acordo com o CPC 09, a Demonstração do Valor Adicionado (DVA) tem por objetivo evidenciar:", "opts": ["O lucro líquido obtido pela entidade no período.", "A geração de caixa proveniente das atividades operacionais.", "A riqueza criada pela entidade e sua distribuição entre os diversos agentes econômicos.", "Apenas os tributos pagos pela entidade."], "ans": 2, "exp": "A DVA evidencia a riqueza criada pela entidade em determinado período e como essa riqueza foi distribuída entre empregados, governo, financiadores e proprietários."}, {"q": "A elaboração da DVA é obrigatória para:", "opts": ["Todas as sociedades empresárias.", "Todas as empresas tributadas pelo Lucro Real.", "As companhias de capital aberto.", "Todas as sociedades limitadas."], "ans": 2, "exp": "No Brasil, a DVA é obrigatória para as companhias abertas. Outras entidades podem elaborá-la facultativamente."}, {"q": "Na Demonstração do Valor Adicionado, a receita de aluguel de imóveis é classificada como:", "opts": ["Remuneração de capital de terceiros.", "Receita operacional.", "Valor Adicionado Recebido em Transferência.", "Outras despesas."], "ans": 2, "exp": "A receita de aluguel é riqueza recebida de terceiros e, na estrutura da DVA, integra o Valor Adicionado Recebido em Transferência."}, {"q": "Na DVA, a despesa com aluguel deve ser classificada como:", "opts": ["Pessoal.", "Remuneração de Capital de Terceiros.", "Valor Adicionado Recebido em Transferência.", "Insumos adquiridos de terceiros."], "ans": 1, "exp": "A despesa de aluguel representa remuneração paga pelo uso de capital de terceiros, sendo apresentada na distribuição do valor adicionado."}, {"q": "Uma empresa reconheceu receita financeira de R$ 20.000, receita de equivalência patrimonial de R$ 35.000 e receita de aluguel de R$ 15.000. O Valor Adicionado Recebido em Transferência será de:", "opts": ["R$ 35.000", "R$ 50.000", "R$ 55.000", "R$ 70.000"], "ans": 3, "exp": "Somam-se os três itens: 20.000 + 35.000 + 15.000 = R$ 70.000."}, {"q": "Na distribuição do valor adicionado, os salários, férias, décimo terceiro e FGTS são classificados como:", "opts": ["Insumos adquiridos de terceiros.", "Remuneração de Capital Próprio.", "Pessoal.", "Tributos."], "ans": 2, "exp": "Esses valores representam benefícios destinados aos empregados e integram o grupo Pessoal."}, {"q": "Uma empresa possui salários CLT de R$ 900.000 e serviços terceirizados de R$ 100.000. Na DVA, o valor apresentado no grupo Pessoal será de:", "opts": ["R$ 1.000.000", "R$ 900.000", "R$ 100.000", "Zero."], "ans": 1, "exp": "Somente os empregados próprios integram Pessoal. Os terceirizados são classificados como serviços de terceiros. Logo, R$ 900.000."}, {"q": "Qual das alternativas pertence à Distribuição do Valor Adicionado?", "opts": ["Receita de vendas.", "Receita financeira.", "Depreciação.", "Remuneração de Capitais Próprios."], "ans": 3, "exp": "A remuneração de capitais próprios integra a distribuição da riqueza. As demais pertencem à formação do valor adicionado."}, {"q": "A Demonstração do Valor Adicionado é dividida em duas grandes partes:", "opts": ["Ativo e Passivo.", "Receitas e Despesas.", "Formação da riqueza e Distribuição da riqueza.", "Fluxo Operacional e Fluxo Financeiro."], "ans": 2, "exp": "A primeira parte mostra como a riqueza foi formada; a segunda, como foi distribuída."}, {"q": "Uma sociedade apresentou receita de vendas de R$ 600.000 e provisão para créditos de liquidação duvidosa de R$ 20.000. O valor apresentado no item Receitas da DVA será:", "opts": ["R$ 620.000", "R$ 600.000", "R$ 580.000", "R$ 560.000"], "ans": 2, "exp": "A PCLD reduz as receitas na DVA: 600.000 − 20.000 = R$ 580.000."}];
let current=0, score=0, answered=Array(questions.length).fill(null);

function startQuiz(){
 document.getElementById('start').classList.add('hidden');
 document.getElementById('quiz').classList.remove('hidden');
 render();
}
function render(){
 const q=questions[current];
 document.getElementById('badge').textContent=`Questão ${current+1} de ${questions.length}`;
 document.getElementById('question').textContent=q.q;
 document.getElementById('progress').style.width=((current+1)/questions.length*100)+'%';
 const box=document.getElementById('options'); box.innerHTML='';
 q.opts.forEach((o,i)=>{
   const b=document.createElement('button'); b.className='option';
   b.innerHTML=`<strong>${String.fromCharCode(65+i)})</strong> ${o}`;
   b.onclick=()=>answer(i);
   if(answered[current]!==null){
     b.disabled=true;
     if(i===q.ans)b.classList.add('correct');
     if(i===answered[current] && i!==q.ans)b.classList.add('wrong');
   }
   box.appendChild(b);
 });
 const exp=document.getElementById('explanation');
 if(answered[current]!==null){
   exp.style.display='block';
   const hit=answered[current]===q.ans;
   exp.innerHTML=`<strong>${hit?'✅ Resposta correta!':'❌ Resposta incorreta.'}</strong><br><br><strong>Gabarito: ${String.fromCharCode(65+q.ans)}</strong><br>${q.exp}`;
 } else exp.style.display='none';
}
function answer(i){
 if(answered[current]!==null)return;
 answered[current]=i;
 if(i===questions[current].ans)score++;
 render();
}
function nextQuestion(){
 if(answered[current]===null){alert('Marque uma alternativa antes de continuar.');return;}
 if(current<questions.length-1){current++;render();} else finish();
}
function prevQuestion(){if(current>0){current--;render();}}
function finish(){
 document.getElementById('quiz').classList.add('hidden');
 document.getElementById('result').classList.remove('hidden');
 document.getElementById('progress').style.width='100%';
 document.getElementById('score').textContent=`${score}/10`;
 let m=score===10?'Excelente! Você dominou o conteúdo de DVA.':score>=8?'Muito bom! Revise apenas os detalhes.':score>=6?'Bom resultado, mas ainda há pontos para revisar.':'Reforce a estrutura da DVA e tente novamente.';
 document.getElementById('message').textContent=m;
}
function restartQuiz(){current=0;score=0;answered=Array(questions.length).fill(null);document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render();}
</script>
</body></html>
